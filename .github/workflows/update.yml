name: Update jobs & deploy

on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Asia/Taipei, daily
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated company ids (blank = all)"
        required: false
      rebaseline:
        description: "Reset 'first seen' dates of all current jobs to their posted date"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "companies.yaml", "scraper/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v

      # Job-description cache: rebuildable, so it lives in the Actions cache rather than git.
      - name: Restore detail cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: details-${{ github.run_id }}
          restore-keys: details-

      - name: Crawl career sites
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: enables LLM relevance stage
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          # Companies marked local_only (Workday, UMC, FET) are crawled from a machine in Taiwan by
          # scripts/local_crawl.sh; here they keep their last listings.
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m scraper.run --mode cloud --only "${{ github.event.inputs.only }}"
          elif [ "${{ github.event.inputs.rebaseline }}" = "true" ]; then
            python -m scraper.run --mode cloud --rebaseline
          else
            python -m scraper.run --mode cloud
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update jobs $(date -u +%F)"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -R web/. _site/
          cp data/jobs.json data/history.json _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
