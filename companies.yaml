# Company registry. Each entry points at the company's OWN career site backend.
# Verify a new entry with:  python -m scraper.probe --company <id>
#
# fields:
#   id, name, name_zh, group (see scraper/config.py GROUP_LABELS)
#   careers_url        human-facing official careers page (shown on the site)
#   source + params    adapter in scraper/sources/__init__.py
#   all_taiwan: true   source is already Taiwan-only (skip location filtering)
#   in_salary_survey   company appears in github.com/Hikari-Tsai/software-salary
#   disabled: true     keep the entry but skip it

companies:
  # ---------------------------------------------------------------- global tech
  - id: google
    name: Google
    name_zh: 谷歌
    group: global_tech
    careers_url: https://www.google.com/about/careers/applications/jobs/results?location=Taiwan
    source: google
    in_salary_survey: true

  - id: amazon
    name: Amazon / AWS
    name_zh: 亞馬遜
    group: global_tech
    careers_url: https://www.amazon.jobs/en/search?normalized_country_code[]=TWN
    source: amazon
    in_salary_survey: true

  - id: nvidia
    name: NVIDIA
    name_zh: 輝達
    group: global_tech
    careers_url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
